{% extends "base.html" %}

{% block title %}Analysis{% endblock %}

{% block content %}

<div class="hero">
<h1>Spending Analysis</h1>
<p>Understand where your money goes</p>
</div>

<!-- CHART CONTAINER -->
<div style="display:flex; flex-wrap:wrap; gap:30px; justify-content:center;">

<!-- DONUT CHART -->
<div style="width:300px; max-width:90%; margin:auto;">
<h3 style="text-align:center;">Category Distribution</h3>
<canvas id="pieChart"></canvas>
</div>

<!-- BAR CHART -->
<div style="width:500px; max-width:95%;">
<h3 style="text-align:center;">Monthly Spending</h3>
<div style="height:300px;">
    <canvas id="barChart"></canvas>
</div>
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>

// -------- DATA --------
const categoryLabels = {{ category_data | map(attribute=0) | list | tojson }};
const categoryValues = {{ category_data | map(attribute=1) | list | tojson }};

const rawMonths = {{ monthly_data | map(attribute=0) | list | tojson }};
const monthValues = {{ monthly_data | map(attribute=1) | list | tojson }};

// Convert 2026-04 → Apr
const monthLabels = rawMonths.map(m => {
    const date = new Date(m + "-01");
    return date.toLocaleString('default', { month: 'short' });
});

// -------- DONUT CHART --------
const total = categoryValues.reduce((a, b) => a + b, 0);

const centerTextPlugin = {
    id: 'centerText',
    beforeDraw(chart) {
        const { width, height } = chart.chartArea;
        const ctx = chart.ctx;

        ctx.save();

        ctx.font = "bold 16px Arial";
        ctx.fillStyle = "#111";
        ctx.textAlign = "center";
        ctx.fillText("Total", width / 2, height / 2 - 10);

        ctx.font = "bold 18px Arial";
        ctx.fillText("₹" + total, width / 2, height / 2 + 12);

        ctx.restore();
    }
};

new Chart(document.getElementById("pieChart"), {
    type: "doughnut",
    data: {
        labels: categoryLabels,
        datasets: [{
            data: categoryValues,
            backgroundColor: [
                "#ef4444",
                "#22c55e",
                "#3b82f6",
                "#f59e0b",
                "#8b5cf6",
                "#14b8a6"
            ],
            borderWidth: 2
        }]
    },
    options: {
        cutout: "65%",
        plugins: {
            legend: {
                position: "bottom",
                labels: {
                    padding: 15,
                    boxWidth: 12
                }
            }
        }
    },
    plugins: [centerTextPlugin]
});

// -------- BAR CHART --------
const barChart = new Chart(document.getElementById("barChart"), {
    type: "bar",
    data: {
        labels: monthLabels,
        datasets: [{
            label: "Amount",
            data: monthValues,
            backgroundColor: "#3b82f6",
            borderRadius: 6,
            barThickness: 40,
            categoryPercentage: 0.5,
            barPercentage: 0.5
        }]
    },
    options: {
    responsive: true,
    maintainAspectRatio: false,

    layout: {
        padding: {
            top: 20,
            left: 20,
            right: 20
        }
    },

    scales: {
        y: {
            beginAtZero: true
        }
    },

    plugins: {
        legend: {
            display: false
        }
    }
}
});
// -------- ADD VALUE ON TOP OF BARS --------
barChart.options.plugins.tooltip.enabled = true;

barChart.options.animation = {
    onComplete: function() {
        const chart = this;
        const ctx = chart.ctx;

        chart.data.datasets.forEach(function(dataset, i) {
            const meta = chart.getDatasetMeta(i);

            meta.data.forEach(function(bar, index) {
                const value = dataset.data[index];
                ctx.fillStyle = "#111";
                ctx.font = "bold 12px Arial";
                ctx.textAlign = "center";
                ctx.fillText(value, bar.x, bar.y - 5);
            });
        });
    }
};

barChart.update();

</script>

{% endblock %}

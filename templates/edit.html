{% extends "base.html" %}

{% block title %}Edit Expense{% endblock %}

{% block content %}

<div class="hero">
<h1>Edit Expense</h1>
</div>

<div class="panel white-panel" style="max-width:650px; margin:auto;">

<form method="POST">

<input type="text" name="title" value="{{ expense[2] }}" required>

<input type="number" name="amount" value="{{ expense[3] }}" required>

<select name="category" required>
<option {% if expense[4]=='Food' %}selected{% endif %}>Food</option>
<option {% if expense[4]=='Travel' %}selected{% endif %}>Travel</option>
<option {% if expense[4]=='Shopping' %}selected{% endif %}>Shopping</option>
<option {% if expense[4]=='Bills' %}selected{% endif %}>Bills</option>
<option {% if expense[4]=='Other' %}selected{% endif %}>Other</option>
</select>

<input type="date" name="date" value="{{ expense[5] }}" required>

<button type="submit">Update Expense</button>

</form>

</div>

{% endblock %}
